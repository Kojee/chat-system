services:
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: userdb
    volumes:
      - pgdata-user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres-chat:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chatdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata-chat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatdb"]
      interval: 2s
      timeout: 3s
      retries: 10

  mcp-user:
    build: ./mcp_user_server
    environment:
      DATABASE_URL: postgresql+psycopg://user:pass@postgres-user:5432/userdb
      HOST: 0.0.0.0
      PORT: "8001"
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status == 200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres-kb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kbdb
    volumes:
      - pgdata-kb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kbdb"]
      interval: 2s
      timeout: 3s
      retries: 10

  mcp-kb:
    build: ./mcp_kb_server
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql+psycopg://kb:kb@postgres-kb:5432/kbdb
      HOST: 0.0.0.0
      PORT: "8002"
    ports:
      - "8002:8002"
    volumes:
      - kb-chroma:/app/chroma_data
    depends_on:
      postgres-kb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status == 200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10

  chat-backend:
    build: ./chat_backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHATDB_DSN: postgresql://chat:chat@postgres-chat:5432/chatdb
      USER_MCP_URL: http://mcp-user:8001/mcp
      KB_MCP_URL: http://mcp-kb:8002/mcp
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      postgres-chat:
        condition: service_healthy
      mcp-user:
        condition: service_healthy
      mcp-kb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status == 200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata-user:
  pgdata-chat:
  pgdata-kb:
  kb-chroma:
