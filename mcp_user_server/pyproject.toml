[project]
name = "mcp-user-server"
version = "0.1.0"
description = "Server MCP Utenti"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "mcp[cli]>=1.27.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
mcp-user-server = "mcp_user_server.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
