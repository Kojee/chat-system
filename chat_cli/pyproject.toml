[project]
name = "chat-cli"
version = "0.1.0"
description = "CLI client for chat_backend (SSE streaming)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
]

[project.scripts]
chat-cli = "chat_cli.cli:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
